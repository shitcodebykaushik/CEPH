<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal — Micro-Cloud</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;flex-direction:column;height:100vh}
.toolbar{display:flex;align-items:center;padding:10px 16px;background:#161b22;border-bottom:1px solid #30363d;gap:12px}
.toolbar span{font-size:13px;color:#8b949e}
.toolbar .ws-id{color:#58a6ff;font-family:monospace;font-size:12px}
.toolbar .close{color:#8b949e;margin-left:auto;cursor:pointer;font-size:14px;padding:4px 12px;border-radius:4px;border:1px solid #30363d;background:#21262d;text-decoration:none;color:#e6edf3}
.toolbar .close:hover{background:#30363d}
#terminal-container{flex:1;padding:4px}
.xterm{height:100%}
.xterm-viewport{overflow-y:auto!important}
</style>
</head>
<body>
<div class="toolbar">
  <span>Terminal</span>
  <span class="ws-id" id="ws-info">connecting...</span>
  <a class="close" href="/portal" onclick="closeTerminal()">✕ Close</a>
</div>
<div id="terminal-container"></div>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
<script>
const term = new Terminal({
  cursorBlink: true,
  cursorStyle: 'block',
  fontSize: 14,
  fontFamily: "'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace",
  theme: {
    background: '#0d1117',
    cursor: '#58a6ff',
    foreground: '#e6edf3',
    selectionBackground: '#264f78',
    black: '#484f58',
    red: '#ff7b72',
    green: '#3fb950',
    yellow: '#d29922',
    blue: '#58a6ff',
    magenta: '#bc8cff',
    cyan: '#39c5cf',
    white: '#e6edf3',
    brightBlack: '#6e7681',
    brightRed: '#ffa198',
    brightGreen: '#56d364',
    brightYellow: '#e3b341',
    brightBlue: '#79c0ff',
    brightMagenta: '#d2a8ff',
    brightCyan: '#56d4dd',
    brightWhite: '#ffffff',
  }
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal-container'));
fitAddon.fit();

const params = new URLSearchParams(window.location.search);
const wsId = params.get('id');
document.getElementById('ws-info').textContent = wsId ? wsId.slice(0,12)+'…' : '—';

const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
const ws = new WebSocket(`${protocol}//${window.location.host}/api/v1/workspaces/${wsId}/terminal`);
ws.onopen = () => {
  term.focus();
  term.onData(data => {
    ws.send(new TextEncoder().encode(data));
  });
};

ws.onmessage = e => {
  if (e.data instanceof Blob) {
    e.data.arrayBuffer().then(buf => term.write(new Uint8Array(buf)));
  } else {
    term.write(e.data);
  }
};

ws.onclose = () => {
  term.write('\r\n\x1b[31m[connection closed]\x1b[0m\r\n');
};

ws.onerror = () => {
  term.write('\r\n\x1b[31m[connection error]\x1b[0m\r\n');
};

window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => fitAddon.fit(), 100);
});

setTimeout(() => fitAddon.fit(), 200);

function closeTerminal() {
  ws.close();
}
</script>
</body>
</html>
